name: Build iOS IPA (AppJuana)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI Workloads
        run: |
          dotnet workload install maui

      - name: Restore Project Dependencies
        run: |
          dotnet restore AppJuana/AppJuana.csproj

      - name: Build iOS Application (Ad-Hoc Signing)
        run: |
          dotnet build AppJuana/AppJuana.csproj \
            -c Release \
            -f net9.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:CodesignKey="-" \
            -p:CodesignProvision="" \
            -p:ArchiveOnBuild=false \
            -p:ValidateXcodeVersion=false \
            -p:_IgnoreXcodeVersionCheck=true \
            -p:MtouchLink=None \
            -p:PublishTrimmed=true \
            --verbosity normal

      - name: Package IPA for Sideloading
        run: |
          mkdir -p Payload
          APP_PATH=$(find AppJuana/bin/Release/net9.0-ios/ios-arm64 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | grep -v "Pods" | head -n 1)
          fi
          echo "App bundle localizado en: $APP_PATH"
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" Payload/
            zip -r AppJuana.ipa Payload
          else
            echo "Error: No se encontró la carpeta .app"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppJuana-iOS-IPA
          path: AppJuana.ipa
          retention-days: 14
