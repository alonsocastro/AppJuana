name: Build iOS IPA (AppJuana)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install .NET MAUI iOS Workload
        run: |
          dotnet workload install maui-ios

      - name: Build iOS Application (Release)
        run: |
          dotnet build AppJuana/AppJuana.csproj \
            -f net9.0-ios \
            -c Release \
            -r ios-arm64 \
            -p:CodesignKey="" \
            -p:CodesignProvision=""

      - name: Package into IPA for Sideloading
        run: |
          mkdir -p Payload
          APP_PATH=$(find AppJuana/bin/Release/net9.0-ios -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | grep -v "Pods" | head -n 1)
          fi
          echo "App bundle encontrado en: $APP_PATH"
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" Payload/
            zip -r AppJuana.ipa Payload
          else
            echo "Error: No se encontró la carpeta .app"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppJuana-iOS-IPA
          path: AppJuana.ipa
          retention-days: 14
