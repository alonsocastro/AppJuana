name: Build iOS IPA (AppJuana)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI iOS Workload
        run: |
          sudo dotnet workload install maui-ios

      - name: Build and Publish iOS App
        run: |
          dotnet publish AppJuana/AppJuana.csproj \
            -f net9.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:CodesignKey="" \
            -p:CodesignProvision="" \
            -p:ArchiveOnBuild=false \
            -p:EnableCodeSigning=false \
            -o ./output

      - name: Create IPA for Sideloading
        run: |
          mkdir -p Payload
          APP_PATH=$(find ./output -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          echo "App encontrado: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r AppJuana.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppJuana-iOS-IPA
          path: AppJuana.ipa
          retention-days: 14
