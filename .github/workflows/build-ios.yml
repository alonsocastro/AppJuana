name: Build iOS IPA (AppJuana)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI iOS Workload
        run: |
          sudo dotnet workload install maui-ios

      - name: Build and Package iOS Application
        run: |
          dotnet build AppJuana/AppJuana.csproj \
            -f net9.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:CreatePackage=true \
            -p:EnableCodeSigning=false \
            -p:_CodesignApp=false \
            -p:CodesignKey="-" \
            -p:CodesignProvision=""

      - name: Locate and Package IPA for Sideloading
        run: |
          mkdir -p output_ipa
          find AppJuana/bin/Release/net9.0-ios -name "*.ipa" -exec cp {} output_ipa/ \;
          if [ -z "$(ls -A output_ipa)" ]; then
            echo "Empaquetando desde .app generado..."
            APP_PATH=$(find AppJuana/bin/Release/net9.0-ios -name "*.app" -type d | head -n 1)
            if [ -z "$APP_PATH" ]; then
              APP_PATH=$(find . -name "*.app" -type d | grep -v "Pods" | head -n 1)
            fi
            echo "App localizado en: $APP_PATH"
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r output_ipa/AppJuana.ipa Payload
          fi
          ls -la output_ipa/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppJuana-iOS-IPA
          path: output_ipa/*.ipa
          retention-days: 14
