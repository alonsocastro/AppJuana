name: Build iOS IPA (AppJuana)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI iOS Workload
        run: |
          sudo dotnet workload install maui-ios

      - name: Build and Package iOS Application
        run: |
          dotnet publish AppJuana/AppJuana.csproj \
            -f net9.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:_CodesignApp=false \
            -p:CodesignKey="-" \
            -p:CodesignProvision="" \
            -p:ArchiveOnBuild=false \
            -v normal

      - name: Locate and Package IPA for Sideloading
        run: |
          mkdir -p output_ipa
          APP_PATH=$(find AppJuana/bin/Release/net9.0-ios/ios-arm64 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | grep -v "Pods" | head -n 1)
          fi
          echo "App localizado en: $APP_PATH"
          if [ -n "$APP_PATH" ]; then
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r output_ipa/AppJuana.ipa Payload
          else
            echo "Error: No se encontró la carpeta .app"
            exit 1
          fi
          ls -la output_ipa/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppJuana-iOS-IPA
          path: output_ipa/*.ipa
          retention-days: 14
