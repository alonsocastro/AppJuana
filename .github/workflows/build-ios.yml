name: Build iOS IPA (AppJuana)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install .NET MAUI Workloads
        run: |
          dotnet workload install maui

      - name: Restore Dependencies
        run: |
          dotnet restore AppJuana/AppJuana.csproj

      - name: Build and Publish iOS App
        run: |
          dotnet publish AppJuana/AppJuana.csproj \
            -c Release \
            -f net9.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:CodesignKey="-" \
            -p:CodesignProvision="" \
            -p:ArchiveOnBuild=false \
            -o ./publish_output

      - name: Package IPA for Sideloading
        run: |
          mkdir -p Payload
          APP_PATH=$(find ./publish_output -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | grep -v "Pods" | head -n 1)
          fi
          echo "App encontrado en: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r AppJuana.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppJuana-iOS-IPA
          path: AppJuana.ipa
          retention-days: 14
